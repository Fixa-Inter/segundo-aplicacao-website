name: Qualidade do FIXA Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v6
      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Conferir formatação
        run: npm run format:check
      - name: Analisar código
        run: npm run lint
      - name: Executar testes
        run: npm test
      - name: Compilar aplicação
        run: npm run build
