# Exclusivo do ambiente Docker local. Credenciais geradas em dev.local/stack.env.
spring.application.name=fixa-api-local
server.port=8080
spring.datasource.url=jdbc:postgresql://postgres:5432/fixa
spring.datasource.username=fixa
spring.datasource.password=${FIXA_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.data.redis.host=redis
spring.data.redis.port=6379
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=3600
security.jwt.refresh-expiration-seconds=2592000
app.redis.upstash.rest-url=${UPSTASH_REDIS_REST_URL}
app.redis.upstash.rest-token=${UPSTASH_REDIS_REST_TOKEN}
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
spring.mail.host=mailpit
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=fixa@fixa.test
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.username=
spring.mail.password=
