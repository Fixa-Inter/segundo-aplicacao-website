name: fixa-web-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fixa
      POSTGRES_USER: fixa
      POSTGRES_PASSWORD: ${FIXA_DB_PASSWORD:?Prepare o ambiente com npm run local:prepare}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fixa -d fixa']
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
  redis-http:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${FIXA_REDIS_TOKEN:?Prepare o ambiente}
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
  redis-rest:
    image: nginx:1.28-alpine
    volumes:
      - ./redis-http.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      redis-http:
        condition: service_started
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:8025:8025'
  api:
    build:
      context: ../dev.local/api
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/
      FIXA_DB_PASSWORD: ${FIXA_DB_PASSWORD}
      JWT_SECRET: ${FIXA_JWT_SECRET:?Prepare o ambiente}
      UPSTASH_REDIS_REST_URL: http://redis-rest:80
      UPSTASH_REDIS_REST_TOKEN: ${FIXA_REDIS_TOKEN}
    volumes:
      - ./application-local.properties:/config/application.properties:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis-rest:
        condition: service_started
      mailpit:
        condition: service_started
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8080/actuator/health]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
